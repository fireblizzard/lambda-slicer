name: release

# Version tags build both platforms before one job publishes the release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            extension: zip
          - os: ubuntu-24.04
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The tag has to name the version the app says it is, so the
      # download's name, its VERSION.txt and the release all agree
      - name: Check the tag against the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
          }

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config desktop-file-utils
      - run: cargo test --workspace --locked
      - if: runner.os == 'Windows'
        run: ./scripts/package.ps1
        shell: pwsh
      - if: runner.os == 'Linux'
        run: |
          python3 scripts/package-linux.py
          python3 scripts/check-linux-package.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.${{ matrix.extension }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.${{ matrix.extension }}.sha256
          archive: false
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lambda-slicer-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          files=(
            "dist/lambda-slicer-$version-windows-x86_64.zip"
            "dist/lambda-slicer-$version-windows-x86_64.zip.sha256"
            "dist/lambda-slicer-$version-linux-x86_64.tar.gz"
            "dist/lambda-slicer-$version-linux-x86_64.tar.gz.sha256"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          (cd dist && sha256sum -c ./*.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$tag" "${files[@]}" --verify-tag \
              --title "Lambda Slicer $tag" --generate-notes "${prerelease[@]}"
          fi
