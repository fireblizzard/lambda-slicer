name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact version and components.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # On Linux the GUI's sound output needs the ALSA development package
      # to build. At run time it also needs xkbcommon, a Vulkan or OpenGL
      # driver, a desktop portal for file dialogs and system fonts
      # (docs/release.md).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked

  package:
    # The portable Windows zip and its checksum, kept as build artifacts.
    # Each is uploaded as it is, not zipped again, so the download is the
    # package itself and is named after it
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip.sha256
          archive: false
          if-no-files-found: error
