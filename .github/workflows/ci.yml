name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact version and components.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The GUI needs no native development packages on Linux to build. At
      # run time it needs xkbcommon, a Vulkan or OpenGL driver, a desktop
      # portal for file dialogs and system fonts (docs/release.md).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked

  package:
    # The portable Windows zip, kept as a build artifact
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-slicer-windows-x86_64
          path: dist/*.zip
